[package]
name = "hydro-mena"
version = "0.1.0"
edition = "2021"
description = "RMT-based Molecular Ecological Network Analysis (Deng et al. 2012, BMC Bioinfo 13:113) with optional GPU (wgpu) compute"

[dependencies]
ndarray = "0.16"
nalgebra = "0.33"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.17"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rayon = "1"
wgpu = { version = "23", features = ["wgsl"], optional = true }
wgpu-types = "23"
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

# The examples poke the GPU path directly, so they only build with that feature;
# without this they broke `cargo test` on a default checkout.
[[example]]
name = "gpu_test"
required-features = ["gpu"]

[[example]]
name = "gpu_debug"
required-features = ["gpu"]

[[example]]
name = "parity_3000"
required-features = ["gpu"]

[[example]]
name = "parity_loc"
required-features = ["gpu"]

[[example]]
name = "parity_sizes"
required-features = ["gpu"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
